name: Python Tests

on:
  push:
    branches: [main, feature-*, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python test_number_guessing.py

      - name: Run tests with pytest
        run: |
          pytest test_number_guessing.py -v --cov=enhanced_number_guessing

      - name: Lint with pylint
        run: |
          pylint enhanced_number_guessing.py --exit-zero
        continue-on-error: true

      - name: Check code formatting
        run: |
          black --check enhanced_number_guessing.py test_number_guessing.py
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type checking with mypy
        run: |
          mypy enhanced_number_guessing.py --ignore-missing-imports
        continue-on-error: true

      - name: Security check
        run: |
          pip install bandit
          bandit -r enhanced_number_guessing.py -f json -o bandit-report.json
        continue-on-error: true
